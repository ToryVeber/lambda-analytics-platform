networks:
  backend_net:
    name: ecom_backend_network

services:
  # ==========================================
  # LAYER 1: DATA INGESTION (FRONTEND CONTOUR)
  # ==========================================

  kafka:
    image: apache/kafka:3.7.0
    container_name: ecom_kafka_broker
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093,EXTERNAL://0.0.0.0:9094'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092,EXTERNAL://127.0.0.1:9094'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_OFFER_MAX_MSGS: 1000
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - backend_net
    restart: unless-stopped

  init-kafka:
    image: apache/kafka:3.7.0
    container_name: ecom_kafka_init
    depends_on:
      - kafka
    entrypoint: [ "/bin/sh", "-c" ]
    command: |
      "
      echo '⌛ Waiting for Kafka broker to be fully ready...'
      until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list > /dev/null 2>&1; do
        sleep 2
      done
      
      echo '🚀 Kafka is ready! Creating snowplow_web_events topic...'
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic snowplow_web_events --partitions 3 --replication-factor 1
      echo '✅ Topic created successfully!'
      "
    networks:
      - backend_net

  # ==========================================
  # LAYER 2: STORAGE & OLAP (BACKEND CONTOUR)
  # ==========================================

  garage:
    image: dxflrs/garage:v0.9.4
    container_name: ecom_data_lake_garage
    ports:
      - "3900:3900"
      - "3903:3903"
    volumes:
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
      - ./garage.toml:/etc/garage.toml
    environment:
      - GARAGE_WATCH_CONFIG=1
    networks:
      - backend_net
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    container_name: ecom_analytics_clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: admin
      CLICKHOUSE_PASSWORD: supersecretchpassword123
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    networks:
      - backend_net
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    restart: unless-stopped

  # ==========================================
  # LAYER 3: ORCHESTRATION (AIRFLOW CONTAINER)
  # ==========================================

  airflow:
    image: apache/airflow:2.9.1-python3.11
    container_name: ecom_orchestrator_airflow
    ports:
      - "8080:8080"
    environment:
      - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__CORE__SQL_ALCHEMY_CONN=sqlite:////home/airflow/airflow.db
      - AIRFLOW__WEBSERVER__EXPOSE_CONFIG=True
    volumes:
      - ../airflow/dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
      - ../dbt_platform:/opt/dbt_platform
    command: standalone
    networks:
      - backend_net
    depends_on:
      - kafka
      - clickhouse
      - garage
    restart: unless-stopped

  # ==========================================
  # LAYER 4: OBSERVABILITY & MONITORING
  # ==========================================

  akhq:
    image: tchiotludo/akhq:0.25.0
    container_name: ecom_monitoring_kafka_ui
    ports:
      - "8085:8080"
    environment:
      AKHQ_CONFIGURATION: |
        akhq:
          connections:
            local-kafka:
              properties:
                bootstrap.servers: "kafka:9092"
    networks:
      - backend_net
    depends_on:
      - kafka

  grafana:
    image: grafana/grafana-oss:10.4.1
    container_name: ecom_monitoring_grafana
    ports:
      - "3050:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=adminsupersecret123
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - backend_net
    depends_on:
      - clickhouse

volumes:
  garage_meta:
  garage_data:
  kafka_data:
  clickhouse_data:
  grafana_data:
  airflow_logs:
